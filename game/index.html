<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--ARTIFACT-START-->
<title>Nông Trại Hoang Dã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D field; the HUD is pinned to the corners like a farmer's almanac taped to the screen. Single dark look over the canvas. */
:root{
  color-scheme:dark;
  --night:#111915; --panel:rgba(17,25,21,.88); --panel-2:#1d2b23; --line:rgba(243,234,211,.16);
  --ink:#f3ead3; --muted:#b5b099; --wheat:#e8b84a; --leaf:#7fb069; --ember:#e4572e; --water:#4ea5d9;
  --dusk:#a58ad6; --stone:#a7a29a; --hp:#e2604c; --food:#e8a33d; --mind:#a58ad6; --shade:#0b0f14;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(12px, env(safe-area-inset-left,0px)); --gr:max(12px, env(safe-area-inset-right,0px));
  --gt:calc(10px + env(safe-area-inset-top,0px)); --gb:calc(10px + env(safe-area-inset-bottom,0px));
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:.01em}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* stats */
#stats{position:fixed;left:var(--gl);top:var(--gt);padding:10px 12px;display:grid;gap:6px;width:min(220px,44vw)}
.bar{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:8px;font-size:12px}
.bar .track{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.bar b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
#hpBar{background:var(--hp)} #foodBar{background:var(--food)} #mindBar{background:var(--mind)}
.bar.low .track{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(226,96,76,.6)}}

/* clock */
#clock{position:fixed;right:var(--gr);top:var(--gt);padding:8px 12px;text-align:right;min-width:150px}
#clockTime{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#clockDay{font-size:12px;color:var(--muted);margin-top:2px}
#gold{font-family:var(--f-display);font-weight:700;color:var(--wheat);font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
#menuBtns{position:fixed;right:var(--gr);top:calc(var(--gt) + 98px);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.mbtn kbd{font-family:var(--f-body);font-size:10px;color:var(--muted);margin-left:4px}

/* party mini */
#partyMini{position:fixed;left:var(--gl);top:calc(var(--gt) + 104px);display:grid;gap:6px;width:min(200px,44vw)}
.pm{padding:6px 9px;display:grid;gap:3px;font-size:12px}
.pm.lead{border-color:var(--wheat)}
.pm .top{display:flex;justify-content:space-between;gap:6px}
.pm .top span:first-child{font-weight:600}
.mini-track{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.mini-track i{display:block;height:100%;background:var(--leaf)}
.pm.ko{opacity:.55}

/* prompt + log */
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 86px);padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#prompt kbd{background:var(--wheat);color:#2a1d05;border-radius:5px;padding:1px 6px;margin-right:6px;font-family:var(--f-body);font-size:11px}
#log{position:fixed;left:var(--gl);bottom:calc(var(--gb) + 90px);display:flex;flex-direction:column;gap:4px;width:min(330px,60vw);pointer-events:none}
.msg{background:var(--panel);border-left:3px solid var(--wheat);border-radius:6px;padding:5px 9px;font-size:12.5px;animation:msgIn .25s ease-out;transition:opacity .6s}
.msg.bad{border-left-color:var(--hp)} .msg.good{border-left-color:var(--leaf)} .msg.mon{border-left-color:var(--dusk)}
@keyframes msgIn{from{transform:translateX(-12px);opacity:0}}

/* hotbar */
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--gb);display:flex;gap:5px;padding:6px}
.slot{position:relative;width:clamp(38px,10.4vw,58px);height:clamp(42px,11vw,62px);border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.slot svg{width:clamp(18px,5vw,24px);height:clamp(18px,5vw,24px);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slot .sn{font-size:clamp(8px,2.3vw,10px);color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.slot .k{position:absolute;top:2px;left:4px;font-size:9px;color:var(--muted)}
.slot.sel{border-color:var(--wheat);background:rgba(232,184,74,.16);color:var(--wheat)}
.slot.sel .sn{color:var(--ink)}
.slot.locked{opacity:.38}

/* overlays */
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(60,20,90,.75));opacity:0;transition:opacity 1s}
#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(200,30,20,.55));opacity:0;transition:opacity .4s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s}

/* modal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,6,.55);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.sheet{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{font-size:24px}
.x{background:none;border:1px solid var(--line);border-radius:999px;width:32px;height:32px;font-size:16px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.04)}
.row .name{font-weight:600}
.row .sub{font-size:12px;color:var(--muted)}
.btn{background:var(--wheat);color:#2a1d05;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--ember);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#14110a}
.list{display:grid;gap:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}

/* starter */
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.starter{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:14px;text-align:left;display:grid;gap:8px}
.starter:hover,.starter:focus-visible{border-color:var(--wheat)}
.starter canvas{width:100%;height:120px;border-radius:10px;background:radial-gradient(circle at 50% 70%,#2c4a33,#16221b)}
.starter h3{font-size:20px}
.starter p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.hero{font-family:var(--f-display);font-size:clamp(30px,8vw,46px);line-height:.95;font-weight:800;color:var(--wheat)}

/* party cards */
.mon-card{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent}
.mon-card.lead{border-color:var(--wheat)}
.mon-card canvas{width:84px;height:84px;border-radius:10px;background:radial-gradient(circle at 50% 70%,#2c4a33,#16221b)}
.mon-card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stat-line{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* battle */
#battle{position:fixed;inset:0;pointer-events:none;z-index:15}
#battle .bcard{position:absolute;pointer-events:auto;padding:10px 12px;width:min(260px,62vw);display:grid;gap:5px}
#bFoe{top:var(--gt);right:var(--gr)}
#bMine{bottom:calc(var(--gb) + 150px);left:var(--gl)}
.bname{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:19px;font-weight:700}
.bname small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.hp{height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.hp i{display:block;height:100%;background:var(--leaf);transition:width .45s ease}
.xp{height:4px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.xp i{display:block;height:100%;background:var(--water);transition:width .45s}
.hpnum{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
#bPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--gb);width:min(640px,calc(100vw - 24px));pointer-events:auto;padding:12px;display:grid;gap:10px}
#bText{font-size:15px;min-height:22px;line-height:1.4}
#bMenu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#bMenu .btn{padding:10px;font-size:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}

/* touch */
#touch{display:none}
.is-touch #touch{display:block}
#joy{position:fixed;left:calc(var(--gl) + 4px);bottom:calc(var(--gb) + 96px);width:116px;height:116px;border-radius:50%;background:rgba(17,25,21,.45);border:1px solid var(--line);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(243,234,211,.75)}
#actBtn{position:fixed;right:calc(var(--gr) + 6px);bottom:calc(var(--gb) + 110px);width:78px;height:78px;border-radius:50%;background:var(--wheat);color:#2a1d05;border:0;font-family:var(--f-display);font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.camBtn{position:fixed;bottom:calc(var(--gb) + 196px);width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:18px}
#camL{right:calc(var(--gr) + 60px)} #camR{right:calc(var(--gr) + 8px)}
.is-touch #log{bottom:calc(var(--gb) + 222px);width:min(300px,64vw)}
.is-touch #prompt{bottom:calc(var(--gb) + 80px)}
.is-touch #partyMini{display:none}
.is-touch .mbtn kbd{display:none}
@media (max-width:560px){
  #clockTime{font-size:21px}
  #clock{min-width:0}
  #stats{width:min(190px,48vw);padding:8px 10px}
  .bar{grid-template-columns:52px 1fr 26px;font-size:11px}
  #menuBtns{top:calc(var(--gt) + 84px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="scene" tabindex="0" aria-label="Thế giới nông trại 3D"></canvas>
<div id="vignette"></div><div id="hurt"></div>

<div id="hud">
  <div id="stats" class="panel">
    <div class="bar" id="hpRow"><span>Máu</span><div class="track"><i id="hpBar"></i></div><b id="hpNum">100</b></div>
    <div class="bar" id="foodRow"><span>No bụng</span><div class="track"><i id="foodBar"></i></div><b id="foodNum">100</b></div>
    <div class="bar" id="mindRow"><span>Tinh thần</span><div class="track"><i id="mindBar"></i></div><b id="mindNum">100</b></div>
  </div>
  <div id="clock" class="panel">
    <div id="clockTime">06:00</div>
    <div id="clockDay">Ngày 1 · Xuân · Nắng</div>
    <div id="gold">120 G</div>
  </div>
  <div id="menuBtns">
    <button class="mbtn" id="btnBag">Túi &amp; chế tạo<kbd>C</kbd></button>
    <button class="mbtn" id="btnParty">Đội sinh vật<kbd>P</kbd></button>
    <button class="mbtn" id="btnMenu">Menu<kbd>Esc</kbd></button>
  </div>
  <div id="partyMini"></div>
  <div id="log"></div>
  <div id="prompt" class="panel" hidden></div>
  <div id="hotbar" class="panel"></div>
</div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button id="actBtn">Dùng</button>
  <button class="camBtn" id="camL" aria-label="Xoay camera trái">⟲</button>
  <button class="camBtn" id="camR" aria-label="Xoay camera phải">⟳</button>
</div>

<div id="battle" hidden>
  <div id="bFoe" class="bcard panel">
    <div class="bname"><span id="bFoeName"></span><small id="bFoeLv"></small></div>
    <div><span class="chip" id="bFoeType"></span></div>
    <div class="hp"><i id="bFoeHp"></i></div>
  </div>
  <div id="bMine" class="bcard panel">
    <div class="bname"><span id="bMyName"></span><small id="bMyLv"></small></div>
    <div class="hp"><i id="bMyHp"></i></div>
    <div class="hpnum" id="bMyHpNum"></div>
    <div class="xp"><i id="bMyXp"></i></div>
  </div>
  <div id="bPanel" class="panel">
    <div id="bText"></div>
    <div id="bMenu"></div>
  </div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const $ = s => document.querySelector(s);

const lerp = (a, b, t) => a + (b - a) * t;
const R = Math.random;
const pick = a => a[Math.floor(R() * a.length)];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  seed_carrot:'Hạt cà rốt', seed_tomato:'Hạt cà chua', seed_pumpkin:'Hạt bí ngô', carrot:'Cà rốt', tomato:'Cà chua', pumpkin:'Bí ngô'};

];

const EFF = {grass:{water:2,rock:2,fire:.5,grass:.5}, water:{fire:2,rock:2,grass:.5,water:.5}, fire:{grass:2,water:.5,rock:.5,fire:.5}, rock:{fire:2,grass:.5,water:.5}, dark:{dark:.5}, normal:{rock:.5}};

const SPECIES = {

function genObjects(seed){
  const rng = mulberry32(seed + 7);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){
    const t = T(i, j); if (t.obj || t.t === 'water' || t.t === 'path') continue;
    const edge = Math.min(i, j, W - 1 - i, H - 1 - j);

}

function frontTile(){ const fx = player.pos.x + Math.sin(player.yaw) * .85, fz = player.pos.z + Math.cos(player.yaw) * .85; return [Math.floor(fx), Math.floor(fz)]; }
function give(item, n, quiet){ state.inv[item] = (state.inv[item] || 0) + n; if (!quiet) msg(`+${n} ${ITEMS[item]}`, 'good'); }
function getAction(){
  const tool = HOT[state.sel].id, inv = state.inv;
  if (tool === 'food') return inv[state.foodSel] > 0 ? {label:`Ăn ${ITEMS[state.foodSel]}`, fn:() => eat(state.foodSel)} : {label:`Hết ${ITEMS[state.foodSel]} · R để đổi món`};
  const [ti, tj] = frontTile(), t = T(ti, tj); if (!t) return null;
  const o = t.obj;
  if (o){
    switch (o.kind){
      case 'house': return isNight() ? {label:'Đi ngủ (lưu game)', fn:sleep} : {label:'Nhà của bạn · ngủ được sau 18:00', fn:() => msg('Trời còn sáng, hãy làm việc đã! Có thể ngủ sau 18:00.')};
      case 'bin': return {label:'Thùng hàng: bán nông sản', fn:openBin};
      case 'shop': return {label:'Cửa hàng hạt giống', fn:openShop};
      case 'campfire': return inv.wood > 0 ? {label:`Thêm gỗ vào lửa (${Math.ceil(o.fuel)}s)`, fn:() => feedFire(o)} : {label:`Lửa trại ${o.fuel > 0 ? Math.ceil(o.fuel) + 's' : 'đã tắt'} · cần gỗ`};
      case 'bush': return o.berries ? {label:'Hái quả mọng', fn:() => pickBush(o)} : {label:'Bụi cây chưa ra quả'};
      case 'tree':
        if (tool === 'axe' && state.tools.axe) return {label:'Chặt cây', fn:() => chop(o, true)};
        if (tool === 'hand') return {label:'Bẻ cành bằng tay (chậm)', fn:() => chop(o, false)};
        return {label: state.tools.axe ? 'Chọn Rìu (phím 4) để chặt' : 'Chọn Tay để bẻ cành, hoặc chế tạo Rìu'};
      case 'rock':
        if (tool === 'pickaxe' && state.tools.pickaxe) return {label:'Đập đá', fn:() => mine(o)};
        return {label: state.tools.pickaxe ? 'Chọn Cuốc chim (phím 5)' : 'Cần Cuốc chim để đập đá'};
      case 'grass':
        if (tool === 'hoe') return {label:'Cuốc đất', fn:() => { removeObj(o); till(ti, tj); }};
        return {label:'Nhổ cỏ (lấy sợi cỏ)', fn:() => { removeObj(o); give('fiber', 1 + (R() < .4 ? 1 : 0)); }};
    }
  }
  if (t.crop){
    const c = t.crop, D = CROPS[c.type].days;
    if (c.dead) return {label:'Dọn cây héo', fn:() => removeCrop(t)};
    if (c.days >= D) return {label:`Thu hoạch ${CROPS[c.type].name}`, fn:() => harvest(t)};
    if (tool === 'can' && !t.wet) return state.water > 0 ? {label:'Tưới nước', fn:() => water(ti, tj)} : {label:'Bình hết nước · ra ao múc'};
    return {label:`${CROPS[c.type].name}: còn ${D - c.days} ngày${t.wet ? ' · đã tưới' : ' · cần tưới'}`};
  }
  switch (tool){
    case 'hoe': if (t.t === 'grass' || t.t === 'sand') return {label:'Cuốc đất', fn:() => till(ti, tj)}; break;
    case 'can':
      if (t.t === 'water') return {label:`Múc nước (${state.water}/20)`, fn:() => { state.water = 20; msg('Đã đổ đầy bình tưới.'); }};
      if (t.t === 'tilled' && !t.wet) return state.water > 0 ? {label:'Tưới đất', fn:() => water(ti, tj)} : {label:'Bình hết nước · ra ao múc'};
      break;
    case 'seeds':
      if (t.t === 'tilled') return inv['seed_' + state.seedSel] > 0 ? {label:`Gieo ${CROPS[state.seedSel].name}`, fn:() => plant(ti, tj, state.seedSel)} : {label:`Hết hạt ${CROPS[state.seedSel].name} · R đổi loại / mua ở cửa hàng`};
      break;
    case 'campfire':
      if (inv.campfire > 0 && (t.t === 'grass' || t.t === 'sand' || t.t === 'path')) return {label:'Đặt lửa trại', fn:() => { inv.campfire--; addObj('campfire', ti, tj, {fuel:90}); msg('Lửa trại bùng cháy. Thêm gỗ để giữ lửa.', 'good'); }};
      if (inv.campfire <= 0) return {label:'Chưa có lửa trại · chế tạo trong Túi (C)'};
      break;
    case 'axe': if (!state.tools.axe) return {label:'Chế tạo Rìu: 2 gỗ + 3 sợi cỏ'}; break;
    case 'pickaxe': if (!state.tools.pickaxe) return {label:'Chế tạo Cuốc chim: 3 gỗ + 2 sợi cỏ'}; break;

}
function doAction(){ const a = getAction(); if (a && a.fn){ a.fn(); updateHud(true); } else if (a) msg(a.label); }
function swing(mesh){ const r0 = mesh.rotation.z; tween(.25, k => { mesh.rotation.z = r0 + Math.sin(k * Math.PI * 3) * .12 * (1 - k); }); }
function chop(o, axe){
  o.hp = (o.hp || 0) + 1; swing(o.mesh); state.hunger -= .6;
  const need = axe ? 3 : 6;
  if (o.hp >= need){
    removeObj(o);
    give('wood', (axe ? 3 : 1) + (leadType() === 'rock' ? 1 : 0));
    if (R() < .35) give('fiber', 1);

}
function mine(o){ o.hp = (o.hp || 0) + 1; swing(o.mesh); state.hunger -= .8; if (o.hp >= 4){ removeObj(o); give('stone', 2 + (R() < .4 ? 1 : 0) + (leadType() === 'rock' ? 1 : 0)); } }
function pickBush(o){ o.berries = false; o.regrow = 2; refreshObjMesh(o); give('berry', 2 + (R() < .5 ? 1 : 0)); }
function till(i, j){ const t = T(i, j); t.t = 'tilled'; t.wet = state.weather === 'rain'; paintTile(i, j); state.hunger -= .3; }

/* ================= day cycle ================= */
function newDay(){
  state.day++;
  const prevSeason = Math.floor((state.day - 2) / 7) % 4, season = seasonIdx();
  if (state.pending){ msg(`Thùng hàng đã bán được ${state.pending} G.`, 'good'); state.gold += state.pending; state.pending = 0; }
  const wasRain = state.weather === 'rain';
  state.weather = R() < (season === 1 ? .15 : .25) ? 'rain' : 'sun';
  const grassBoost = leadType() === 'grass';
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){
    const t = tiles[j * W + i];
    if (t.crop && !t.crop.dead){
      const c = t.crop, D = CROPS[c.type].days;
      if (t.wet || wasRain){
        c.dry = 0;
        if (season !== 3 && c.days < D){ c.days++; if (grassBoost && c.days < D && R() < .5) c.days++; }
      } else if (c.days < D){ c.dry++; if (c.dry >= 3){ c.dead = true; msg(`Một cây ${CROPS[c.type].name} đã héo vì thiếu nước.`, 'bad'); } }
      cropMesh(i, j);
    }
    if (t.t === 'tilled'){ t.wet = state.weather === 'rain'; if (!t.crop && R() < .08 && !wasRain){ t.t = 'grass'; } }
    if (t.obj && t.obj.kind === 'bush' && !t.obj.berries && --t.obj.regrow <= 0){ t.obj.berries = true; refreshObjMesh(t.obj); }
  }
  // regrowth in the wild
  let trees = 0, rocks = 0, grass = 0; for (const o of objs){ if (o.kind === 'tree') trees++; else if (o.kind === 'rock') rocks++; else if (o.kind === 'grass') grass++; }
  const sprout = (kind, n, data) => { for (let k = 0, made = 0; k < 60 && made < n; k++){ const i = 2 + Math.floor(R() * (W - 4)), j = 2 + Math.floor(R() * (H - 4)); const t = T(i, j); if (t.obj || t.crop || t.t !== 'grass' || inFarm(i, j)) continue; if (Math.hypot(i - player.pos.x, j - player.pos.z) < 3) continue; addObj(kind, i, j, data()); made++; } };
  if (trees < 260) sprout('tree', 5, () => ({v: R() < .5 ? 0 : 1}));
  if (rocks < 70) sprout('rock', 3, () => ({v: R() < .5 ? 0 : 1}));
  if (grass < 160) sprout('grass', 10, () => ({}));
  if (season !== prevSeason){
    msg(`Mùa ${SEASONS[season].name} đã đến!`, 'good');
    for (const o of objs) if (o.kind === 'tree' || o.kind === 'bush' || o.kind === 'grass') refreshObjMesh(o);
  }
  paintAll();
  for (const w of wilds.slice()) if (SPECIES[w.mon.sp].night) removeWild(w);
  msg(`Ngày ${state.day} bắt đầu${state.weather === 'rain' ? (season === 3 ? ' · tuyết rơi' : ' · trời mưa, cây được tưới') : ''}.`);
}

const battleCam = {pos: new THREE.Vector3(), look: new THREE.Vector3()};
function placeBattle(){
  const w = battle.w; const dir = w.pos.clone().sub(player.pos); dir.y = 0;
  if (dir.lengthSq() < .01) dir.set(Math.sin(player.yaw), 0, Math.cos(player.yaw)); dir.normalize();
  battle.dir = dir;

  companion.pos.copy(myPos); companion.mesh.position.copy(myPos);
  companion.mesh.rotation.y = Math.atan2(dir.x, dir.z); w.mesh.rotation.y = Math.atan2(-dir.x, -dir.z);
  const mid = w.pos.clone().add(myPos).multiplyScalar(.5), side = new THREE.Vector3(dir.z, 0, -dir.x);
  battleCam.pos.copy(mid).addScaledVector(side, 4.6).addScaledVector(dir, -1.6).add(new THREE.Vector3(0, 2.4, 0));
  battleCam.look.copy(mid).add(new THREE.Vector3(0, .5, 0));
  player.pos.copy(myPos).addScaledVector(dir, -1.4).addScaledVector(side, -.9);

async function startBattle(w){

function pickAI(a, d){
  const dt = SPECIES[d.sp].type, mv = monMoves(a);
  const scored = mv.map(id => ({id, s: MOVES[id].power * ((EFF[MOVES[id].type] || {})[dt] || 1) * (.7 + R() * .6)}));
  scored.sort((x, y) => y.s - x.s); return scored[0].id;
}
async function useMove(a, d, id, mine){
  const mv = MOVES[id], as = stats(a), ds = stats(d), at = SPECIES[a.sp].type, dtp = SPECIES[d.sp].type;
  const eff = (EFF[mv.type] || {})[dtp] || 1, stab = mv.type === at ? 1.2 : 1;
  const crit = R() < .07 ? 1.5 : 1;
  const dmg = Math.max(1, Math.floor((mv.power * as.atk / ds.def * .42 + 2) * eff * stab * crit * (.85 + R() * .15)));
  bText.textContent = `${mine ? '' : 'Đối thủ '}${SPECIES[a.sp].name} dùng ${mv.name}!`;
  const am = mine ? companion.mesh : battle.w.mesh, dm = mine ? battle.w.mesh : companion.mesh;
  const start = am.position.clone(), dir = battle.dir.clone().multiplyScalar(mine ? 1 : -1);
  await tweenP(.18, k => am.position.copy(start).addScaledVector(dir, Math.sin(k * Math.PI / 2) * 1.1));
  d.hp = Math.max(0, d.hp - dmg);
  dm.material.emissive.setHex(0xff3322); flashTypeAt(dm.position, mv.type);
  await tweenP(.18, k => am.position.copy(start).addScaledVector(dir, Math.cos(k * Math.PI / 2) * 1.1));
  dm.material.emissive.setHex(dm.userData.baseEmissive);
  if (mv.drain){ a.hp = Math.min(as.maxHp, a.hp + Math.floor(dmg * mv.drain)); }
  battleUi(); await wait(450);
  if (crit > 1) await say('Đòn chí mạng!', 700);
  if (eff > 1) await say('Rất hiệu quả!', 750); else if (eff < 1) await say('Không hiệu quả lắm...', 750);
  if (mv.drain) await say(`${SPECIES[a.sp].name} hút lại sinh lực.`, 650);
}
const fx = [];
function flashTypeAt(pos, type){
  const col = {grass:0x8cd36a, fire:0xff8a3a, water:0x66c6ff, rock:0xb8a890, dark:0xb07aff, normal:0xffffff}[type];
  const m = new THREE.Mesh(ICO, new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.85}));
  m.position.copy(pos).add(new THREE.Vector3(0, .45, 0)); m.scale.setScalar(.2); scene.add(m);
  tween(.4, k => { m.scale.setScalar(.2 + k * .9); m.material.opacity = .85 * (1 - k); m.rotation.y = k * 3; }, () => scene.remove(m));

async function foeTurn(){
  const foe = battle.w.mon, me = battle.mine;
  await useMove(foe, me, pickAI(foe, me), false);
  if (me.hp <= 0){ await myFainted(); return true; }
  return false;
}
async function turn(action){
  if (!battle || battle.busy) return; battle.busy = true; bMenu.innerHTML = '';
  const foe = battle.w.mon;
  try {
    if (action.kind === 'move'){
      const me = battle.mine, meFirst = stats(me).spd >= stats(foe).spd;
      if (meFirst){
        await useMove(me, foe, action.move, true); if (foe.hp <= 0){ await foeFainted(); return; }
        if (await foeTurn()) return;
      } else {
        if (await foeTurn()) return;
        await useMove(me, foe, action.move, true); if (foe.hp <= 0){ await foeFainted(); return; }
      }
    } else if (action.kind === 'orb'){
      if (state.inv.orb <= 0) return;
      state.inv.orb--;
      if (await throwOrb()) return;
      if (await foeTurn()) return;
    } else if (action.kind === 'switch'){
      const m = state.party.find(x => x.uid === action.uid); battle.mine = m; setCompanion(m); placeBattle(); battleUi();
      await say(`Lên nào, ${SPECIES[m.sp].name}!`, 800);
      if (!action.forced && await foeTurn()) return;
    } else if (action.kind === 'run'){
      const chance = SPECIES[foe.sp].night ? .5 : .8;
      if (R() < chance){ await say('Bạn đã chạy thoát!', 800); endBattle('run'); return; }
      await say('Không chạy được!', 700);
      if (await foeTurn()) return;
    }
  } finally { if (battle) battle.busy = false; }
  battleMenu();
}
async function throwOrb(){
  const w = battle.w, foe = w.mon, st = stats(foe);
  await say('Bạn ném Cầu bắt!', 600);
  const orb = new THREE.Mesh(merge([{g:SPH, c:0xe0402a, m:M(0,.06,0,0,0,0,.16,.16,.16)}, {g:SPH, c:0xf3ead3, m:M(0,-.04,0,0,0,0,.155,.12,.155)}, {g:SPH, c:0x222222, m:M(0,.02,.15,0,0,0,.04)}]), vcMat);
  const from = player.pos.clone().add(new THREE.Vector3(0, 1.1, 0)), to = w.pos.clone().add(new THREE.Vector3(0, .2, 0));
  scene.add(orb);
  await tweenP(.55, k => { orb.position.lerpVectors(from, to, k); orb.position.y += Math.sin(k * Math.PI) * 1.6; orb.rotation.x = k * 10; });
  const s0 = w.mesh.scale.x; await tweenP(.25, k => w.mesh.scale.setScalar(s0 * (1 - k)));
  const chance = clamp(((1 - foe.hp / st.maxHp) * .7 + .18) * (1 - Math.max(0, foe.lvl - battle.mine.lvl) * .04), .05, .95);
  const shakeOk = Math.pow(chance, 1 / 3);
  for (let k = 0; k < 3; k++){
    bText.textContent = 'Lắc' + '.'.repeat(k + 1);

    }
    await wait(250);
  }
  scene.remove(orb);
  await say(`Bắt được ${SPECIES[foe.sp].name}!`, 1100);
  if (state.party.length < 6){ state.party.push(foe); await say(`${SPECIES[foe.sp].name} đã gia nhập đội của bạn.`, 900); }
  else await say('Đội đã đủ 6 thành viên, nó được thả về rừng.', 1000);
  endBattle('capture'); return true;
}
async function foeFainted(){
  const foe = battle.w.mon, me = battle.mine;

/* ================= save / load ================= */
const SAVE_KEY = 'nongtrai_hoangda_v1';
function serialize(){
  const tl = [], cr = [], ob = [];
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){
    const t = tiles[j * W + i];
    if (t.t === 'tilled') tl.push([i, j, t.wet ? 1 : 0]);
    if (t.crop) cr.push([i, j, t.crop.type, t.crop.days, t.crop.dry, t.crop.dead ? 1 : 0]);
  }
  for (const o of objs){ if (STATIC[o.kind]) continue; ob.push([o.kind, o.i, o.j, o.v || 0, o.kind === 'bush' ? (o.berries ? 1 : 0) : o.kind === 'campfire' ? Math.round(o.fuel) : 0, o.regrow || 0]); }
  return JSON.stringify({v:1, s:state, tl, cr, ob, px:player.pos.x, pz:player.pos.z});
}
function save(){ try { localStorage.setItem(SAVE_KEY, serialize()); return true; } catch (e) { return false; } }
function load(str){
  const d = JSON.parse(str); if (!d || d.v !== 1) throw new Error('bad save');
  state = Object.assign(defaultState(), d.s); state.inv = Object.assign(defaultState().inv, d.s.inv);
  clearWorld(); genTerrain(state.seed); buildStatics();
  for (const [i, j, w] of d.tl){ const t = T(i, j); t.t = 'tilled'; t.wet = !!w; }
  for (const [kind, i, j, v, a, b] of d.ob){ const data = {v}; if (kind === 'bush'){ data.berries = !!a; data.regrow = b; } if (kind === 'campfire') data.fuel = a; addObj(kind, i, j, data); }
  for (const [i, j, type, days, dry, dead] of d.cr){ const t = T(i, j); t.crop = {type, days, dry, dead: !!dead, mesh:null}; cropMesh(i, j); }
  player.pos.set(d.px, 0, d.pz); if (!canStand(player.pos.x, player.pos.z)) player.pos.set(HX + .5, 0, HZ + 3.5);
  paintAll(); companion.pos.set(0, 0, 0); setCompanion(null); refreshCompanion();
}
function newGame(){
  state = defaultState(); clearWorld(); genTerrain(state.seed); buildStatics(); genObjects(state.seed);
  player.pos.set(HX + .5, 0, HZ + 3.5); player.yaw = 0; camYaw = 0;
  paintAll(); setCompanion(null); updateHud(true); openStarter();
}

/* ================= main update ================= */
let darkTimer = 0, darkHit = 0, autosave = 0, starveTick = 0, lastWarn = 0, clockT = 0;
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), mv = new THREE.Vector3();
function update(dt){
  clockT += dt;
  const playing = mode === 'play';
  // time passes only while exploring
  if (playing){
    const before = state.hour; state.hour += dt * HPS;
    if (state.hour >= 24) state.hour -= 24;
    if (before < 6 && state.hour >= 6) newDay();
    if (before < 18 && state.hour >= 18) msg('Mặt trời lặn. Hãy chuẩn bị lửa hoặc về nhà ngủ.', 'bad');
  }
  // movement
  if (playing){
    let ix = 0, iy = 0;
    if (keys['w'] || keys['arrowup']) iy += 1; if (keys['s'] || keys['arrowdown']) iy -= 1;
    if (keys['a'] || keys['arrowleft']) ix -= 1; if (keys['d'] || keys['arrowright']) ix += 1;
    if (joy.active){ ix += joy.x; iy += joy.y; }
    if (keys['q']) camYaw += dt * 2; if (keys['e']) camYaw -= dt * 2; camYaw += camHold * dt * 2;
    fwd.set(-Math.sin(camYaw), 0, -Math.cos(camYaw)); right.set(Math.cos(camYaw), 0, -Math.sin(camYaw));
    mv.set(0, 0, 0).addScaledVector(fwd, iy).addScaledVector(right, ix);
    const len = Math.min(1, mv.length());
    if (len > .1){
      mv.normalize();
      const run = keys['shift'] || (joy.active && Math.hypot(joy.x, joy.y) > .95);
      const sp = (run ? 6.2 : 4.2) * len * (state.hunger <= 0 ? .7 : 1);
      const nx = player.pos.x + mv.x * sp * dt, nz = player.pos.z + mv.z * sp * dt;
      if (canStand(nx, player.pos.z)) player.pos.x = nx;
      if (canStand(player.pos.x, nz)) player.pos.z = nz;
      const ty = Math.atan2(mv.x, mv.z); let dy = ty - player.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); player.yaw += dy * Math.min(1, dt * 14);
      player.walk += dt * (run ? 14 : 10);
      if (run) state.hunger -= dt * .25;
    } else player.walk = 0;
  }
  player.mesh.position.set(player.pos.x, Math.abs(Math.sin(player.walk)) * .07, player.pos.z);
  player.mesh.rotation.y = player.yaw; player.mesh.rotation.z = Math.sin(player.walk) * .05;

  // companion
  if (companion.mesh && mode !== 'battle'){
    const back = player.pos.clone().add(new THREE.Vector3(-Math.sin(player.yaw) * 1.1, 0, -Math.cos(player.yaw) * 1.1));
    const d = companion.pos.distanceTo(back);
    if (d > 9) companion.pos.copy(back);
    else if (d > .35){
      const step = Math.min(d, dt * (d > 2.5 ? 6.5 : 4.2)), dir = back.clone().sub(companion.pos).normalize();
      const nx = companion.pos.x + dir.x * step, nz = companion.pos.z + dir.z * step;
      if (canStand(nx, companion.pos.z, .2)) companion.pos.x = nx; if (canStand(companion.pos.x, nz, .2)) companion.pos.z = nz;
      if (companion.pos.distanceTo(back) > 4) companion.pos.copy(back);
      companion.mesh.rotation.y = Math.atan2(dir.x, dir.z); companion.walk += dt * 12;
    } else companion.walk = 0;
    const ghost = SPECIES[companion.mon.sp].shape === 'ghost' || SPECIES[companion.mon.sp].shape === 'bug';
    companion.mesh.position.set(companion.pos.x, ghost ? .25 + Math.sin(clockT * 3) * .08 : Math.abs(Math.sin(companion.walk)) * .1, companion.pos.z);
    if (leadType() === 'water' && playing){
      const t = T(Math.floor(companion.pos.x), Math.floor(companion.pos.z));
      if (t && t.t === 'tilled' && t.crop && !t.wet){ t.wet = true; paintTile(Math.floor(companion.pos.x), Math.floor(companion.pos.z)); }
    }
  }

  // wild creatures
  const df = dayFactor(state.hour), night = df < .2;
  if (playing){
    spawnTimer -= dt; if (spawnTimer <= 0){ spawnTimer = 2.5; trySpawn(); }
  }
  for (const w of wilds.slice()){
    if (battle && battle.w === w) continue;
    w.cooldown -= dt; w.hitCd -= dt;
    const dp = w.pos.distanceTo(player.pos);
    if (dp > 34 || (!night && SPECIES[w.mon.sp].night && dp > 12)){ removeWild(w); continue; }
    if (!playing) continue;
    const shade = w.mon.sp === 'bongdem';
    let speed = 1.1;
    if (shade && night && dp < 11 && w.cooldown <= 0){ w.target.copy(player.pos); speed = 2.3; }
    else { w.timer -= dt; if (w.timer <= 0){ w.timer = 2 + R() * 3; w.target.set(w.pos.x + (R() - .5) * 8, 0, w.pos.z + (R() - .5) * 8); } }
    const dir = w.target.clone().sub(w.pos); dir.y = 0; const dl = dir.length();
    if (dl > .2){
      dir.normalize(); const nx = w.pos.x + dir.x * speed * dt, nz = w.pos.z + dir.z * speed * dt;
      let moved = false;
      if (canStand(nx, w.pos.z, .22)){ w.pos.x = nx; moved = true; } if (canStand(w.pos.x, nz, .22)){ w.pos.z = nz; moved = true; }
      if (!moved) w.timer = 0;
      w.mesh.rotation.y = Math.atan2(dir.x, dir.z); w.walk += dt * 10;
    }
    const floaty = SPECIES[w.mon.sp].shape === 'ghost' || SPECIES[w.mon.sp].shape === 'bug';
    w.mesh.position.set(w.pos.x, floaty ? .25 + Math.sin(clockT * 3 + w.walk * .1) * .1 : Math.abs(Math.sin(w.walk)) * .08, w.pos.z);
    if (dp < .85 && w.cooldown <= 0){
      if (followMon()){ startBattle(w); break; }
      else if (shade && w.hitCd <= 0){ w.hitCd = 2; state.hp -= 10; state.sanity -= 5; flashHurt(); msg('Bóng Đêm cào bạn! Đội của bạn đã kiệt sức, hãy chạy về nhà.', 'bad'); }
    }
  }

  // campfires and lights
  const fires = [];
  for (const o of objs){
    if (o.kind !== 'campfire') continue;
    if (playing) o.fuel = Math.max(0, o.fuel - dt * (state.weather === 'rain' ? 1.6 : 1));
    const on = o.fuel > 0; o.flame.visible = on;
    if (on){ const f = 1 + Math.sin(clockT * 18 + o.i) * .08 + Math.sin(clockT * 7.3) * .06; o.flame.scale.set(1, f * (.6 + Math.min(1, o.fuel / 60) * .4), 1); fires.push(o); }
  }
  fires.sort((a, b) => a.mesh.position.distanceToSquared(player.pos) - b.mesh.position.distanceToSquared(player.pos));
  for (let k = 0; k < 3; k++){
    const l = lightPool[k], o = fires[k];
    if (o){ const r = 3 + 4 * Math.min(1, o.fuel / 60); l.position.set(o.i + .5, 1.1, o.j + .5); l.distance = r * 2; l.intensity = (1.4 + Math.sin(clockT * 15 + k) * .15) * (1.1 - df * .8); o.radius = r; }
    else l.intensity = 0;
  }
  const cl = lightPool[3]; let compLight = 0;
  if (companion.mesh && leadType() === 'fire' && companion.mon.hp > 0){ compLight = 3.4 + companion.mon.lvl * .08; cl.color.setHex(companion.mon.sp === 'domdom' ? 0xd8ff8a : 0xffa04a); cl.position.copy(companion.mesh.position).add(new THREE.Vector3(0, 1, 0)); cl.distance = compLight * 2.2; cl.intensity = 1.2 * (1 - df * .9); }
  else cl.intensity = 0;

  // survival
  if (playing){
    const winter = seasonIdx() === 3;
    state.hunger = Math.max(0, state.hunger - dt * (100 / (DAY_SECONDS * 1.5)) * (winter ? 1.4 : 1));
    let lit = df >= .2;
    if (!lit){ for (const o of fires) if (Math.hypot(o.i + .5 - player.pos.x, o.j + .5 - player.pos.z) < o.radius){ lit = true; break; } }
    if (!lit && compLight && companion.mesh.position.distanceTo(player.pos) < compLight) lit = true;
    const nearFire = fires.some(o => Math.hypot(o.i + .5 - player.pos.x, o.j + .5 - player.pos.z) < 4);
    const darkFriend = leadType() === 'dark';
    if (df < .2){ if (!darkFriend) state.sanity -= dt * (lit ? .15 : .9); }
    else state.sanity += dt * (state.weather === 'rain' ? .02 : .12);
    if (nearFire) state.sanity += dt * .3;
    if (state.hunger > 60) state.hp += dt * .18;
    if (state.hunger <= 0){ starveTick += dt; if (starveTick > 1){ starveTick = 0; state.hp -= 1.5; } if (clockT - lastWarn > 12){ lastWarn = clockT; msg('Bạn đang đói lả! Hãy ăn gì đó (phím 7).', 'bad'); } }
    if (state.sanity <= 0 && clockT - lastWarn > 8){ lastWarn = clockT; state.hp -= 4; flashHurt(); msg('Những tiếng thì thầm vây quanh bạn...', 'bad'); }
    if (!lit){
      if (darkTimer === 0) msg('Trời tối quá... Có gì đó đang rình rập. Hãy tìm ánh sáng!', 'bad');
      darkTimer += dt;
      if (darkTimer > 5){ darkHit -= dt; if (darkHit <= 0){ darkHit = 2.4; state.hp -= 11; state.sanity -= 4; flashHurt(); msg('Có thứ gì đó cào bạn trong bóng tối!', 'bad'); } }
    } else { darkTimer = 0; darkHit = 0; }
    state.hp = clamp(state.hp, 0, 100); state.sanity = clamp(state.sanity, 0, 100);
    if (state.hp <= 0) die();
    autosave += dt; if (autosave > 45){ autosave = 0; save(); }
  }

  // weather
  rain.visible = state.weather === 'rain';
  if (rain.visible){
    const snow = seasonIdx() === 3; rainMat.size = snow ? .14 : .07; rainMat.color.setHex(snow ? 0xffffff : 0xaaccff);
    const fall = snow ? 2.2 : 16, a = rainGeo.attributes.position.array;
    for (let k = 0; k < RAIN_N; k++){ a[k*3+1] -= fall * dt; if (snow) a[k*3] += Math.sin(clockT + k) * dt * .3; if (a[k*3+1] < 0) a[k*3+1] = 14; }
    rainGeo.attributes.position.needsUpdate = true; rain.position.set(player.pos.x, 0, player.pos.z);
  }

  // tweens
  for (let k = tweens.length - 1; k >= 0; k--){ const tw = tweens[k]; tw.t += dt; const p = Math.min(1, tw.t / tw.dur); tw.fn(p); if (p >= 1){ tweens.splice(k, 1); tw.done && tw.done(); } }

  // camera
  if (mode === 'battle' && battle){
    camera.position.lerp(battleCam.pos, Math.min(1, dt * 4)); camera.lookAt(battleCam.look);
  } else {
    const dist = 11.5 * camZoom, hgt = 9.5 * camZoom;
    const target = _s.set(player.pos.x + Math.sin(camYaw) * dist, hgt, player.pos.z + Math.cos(camYaw) * dist);
    camera.position.lerp(target, Math.min(1, dt * 5));
    camera.lookAt(player.pos.x, .8, player.pos.z);
  }
  updateLighting();

  // target highlight + prompt
  if (playing){
    const [ti, tj] = frontTile(); hl.visible = !!T(ti, tj) && HOT[state.sel].id !== 'food'; hl.position.set(ti + .5, .03, tj + .5);
    hudTimer -= dt;
    if (hudTimer <= 0){
      hudTimer = .12; updateHud();
      const a = getAction(), p = $('#prompt');
      if (a){ p.hidden = false; p.innerHTML = a.fn ? `<kbd>${isTouch ? 'Dùng' : 'Space'}</kbd>${esc(a.label)}` : esc(a.label); } else p.hidden = true;
    }
  } else hl.visible = false;
  if (groundDirty){ gtex.needsUpdate = true; groundDirty = false; }
}
const hl = new THREE.Mesh(new THREE.RingGeometry(.42, .5, 4, 1, Math.PI / 4), new THREE.MeshBasicMaterial({color:0xfff3c4, transparent:true, opacity:.75, depthWrite:false}));
hl.rotation.x = -Math.PI / 2; hl.scale.set(1.35, 1.35, 1.35); scene.add(hl);

/* ================= boot ================= */
const clock = new THREE.Clock();
function frame(){ const dt = Math.min(.05, clock.getDelta()); if (state) update(dt); renderer.render(scene, camera); requestAnimationFrame(frame); }
function start(data){
  let saved = data && data.save;
  if (!saved){ try { saved = localStorage.getItem(SAVE_KEY); } catch (e) { saved = null; } }
  let ok = false;
  if (saved){ try { load(saved); ok = state.party.length > 0; } catch (e) { ok = false; } }
  if (ok){ mode = 'play'; updateHud(true); msg(`Chào mừng trở lại! Ngày ${state.day}, mùa ${SEASONS[seasonIdx()].name}.`, 'good'); }
  else newGame();
  camera.position.set(player.pos.x, 10, player.pos.z + 12);
  requestAnimationFrame(frame);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({save: state && state.party.length ? serialize() : null})); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__game = {get state(){ return state; }, player, wilds, newDay, startBattle: () => wilds[0] && startBattle(wilds[0])};
})();
</script>
