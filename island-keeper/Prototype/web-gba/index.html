<title>Hòn Gió Farm Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: full-height pixel stage; HUD (date, clock, bag) on top, hotbar + party at the bottom, touch pad on phones */
:root {
  --ink: #2b1d12;
  --cream: #fff4d6;
  --sun: #f4c542;
  --panel: rgba(43,29,18,.88);
  --edge: #8a6440;
  --leaf: #7cb252;
  --font: "Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--cream); font-family: var(--font); font-size: 15px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
}
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
h1 { margin: 0; font-size: 1.5rem; color: var(--sun); font-weight: 600; }
.keys { color: #d9c7a3; font-size: .85rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }
kbd { font-family: var(--font); background: #3b2a1a; border: 1px solid var(--edge); border-bottom-width: 3px; border-radius: 3px; padding: 0 4px; color: var(--cream); }
.stage { position: relative; flex: 1; min-height: 320px; border: 3px solid #120b06; border-radius: 4px; overflow: hidden; background: var(--leaf); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
.hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; flex-wrap: wrap; }
.box { background: var(--panel); border: 2px solid var(--edge); border-radius: 4px; padding: 3px 9px; font-variant-numeric: tabular-nums; }
.bottom { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 0 8px; pointer-events: none; }
.bar { display: flex; gap: 4px; background: var(--panel); border: 2px solid var(--edge); border-radius: 4px; padding: 4px; pointer-events: auto; }
.slot { position: relative; width: 44px; height: 44px; border: 2px solid #5a4029; border-radius: 3px; background: #3b2a1a; padding: 0; cursor: pointer; color: var(--cream); font-family: var(--font); }
.slot canvas { width: 32px; height: 32px; margin: auto; }
.slot.on { border-color: var(--sun); background: #5a4029; }
.slot .n { position: absolute; left: 2px; top: 0; font-size: .7rem; color: #d9c7a3; }
.slot .c { position: absolute; right: 2px; bottom: 0; font-size: .75rem; }
.slot:focus-visible { outline: 2px solid var(--sun); }
.party .slot.out { border-color: #7fd0e8; }
.party .label { align-self: center; font-size: .8rem; color: #d9c7a3; padding: 0 4px; }
.toast { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); background: var(--panel); border: 2px solid var(--sun); border-radius: 4px; padding: 5px 12px; text-align: center; max-width: 86%; pointer-events: none; }
.touch { position: absolute; right: 10px; bottom: 76px; display: flex; flex-direction: column; gap: 8px; }
.touch button { font-family: var(--font); width: 64px; height: 48px; background: var(--panel); color: var(--cream); border: 2px solid var(--edge); border-radius: 6px; font-size: .95rem; }
@media (hover: hover) and (pointer: fine) { .touch { display: none; } }
.fade { position: absolute; inset: 0; background: #0b0a14; opacity: 0; pointer-events: none; transition: opacity .5s; display: grid; place-items: center; font-size: 1.4rem; color: var(--cream); }
.fade.show { opacity: 1; }
</style>

<header>
  <h1>Hòn Gió · bản thử</h1>
  <div class="keys">
    <span><kbd>WASD</kbd> đi 8 hướng</span><span><kbd>1</kbd>-<kbd>4</kbd> chọn đồ</span>
    <span><kbd>Space</kbd> dùng</span><span><kbd>E</kbd> ngủ (ở cửa nhà)</span><span><kbd>Q</kbd> gọi / thu linh thú</span>
  </div>
</header>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Nông trại pixel: làm vườn và bắt linh thú"></canvas>
  <div class="hud">
    <span class="box" id="dateBox">Xuân · Ngày 1</span>
    <span class="box" id="clockBox">6:00</span>
    <span class="box" id="bagBox">Củ cải: 0</span>
  </div>
  <div class="toast" id="toast">Chọn Cuốc (1), đứng cạnh ô đất trong vườn rồi bấm Space</div>
  <div class="bottom">
    <div class="bar" id="hotbar"></div>
    <div class="bar party" id="party"><span class="label">Linh thú</span></div>
  </div>
  <div class="touch">
    <button id="tUse" type="button">Dùng</button>
    <button id="tE" type="button">Ngủ</button>
    <button id="tQ" type="button">Gọi</button>
  </div>
  <div class="fade" id="fade"></div>
</div>

<script>
// ===== data =====
const ROWS = {"down_idle":[[0,0],[48,0]],"down_walk":[[0,40],[48,40],[96,40],[144,40]],"downside_idle":[[0,80],[48,80]],"downside_walk":[[0,120],[48,120],[96,120],[144,120]],"side_idle":[[0,160],[48,160]],"side_walk":[[0,200],[48,200],[96,200],[144,200]],"upside_idle":[[0,240],[48,240]],"upside_walk":[[0,280],[48,280],[96,280],[144,280]],"up_idle":[[0,320],[48,320]],"up_walk":[[0,360],[48,360],[96,360],[144,360]],"down_hoe":[[0,400],[48,400],[96,400]],"down_water":[[0,440],[48,440],[96,440]],"down_lasso":[[0,480],[48,480],[96,480]],"side_hoe":[[0,520],[48,520],[96,520]],"side_water":[[0,560],[48,560],[96,560]],"side_lasso":[[0,600],[48,600],[96,600]],"up_hoe":[[0,640],[48,640],[96,640]],"up_water":[[0,680],[48,680],[96,680]],"up_lasso":[[0,720],[48,720],[96,720]]};
const FPS = { idle: 2, walk: 8, hoe: 8, water: 6, lasso: 8 };
const CW = 48, CH = 40, FOOT = 38;
const CRE = [
  { id: 'ma',   name: 'Mạ',   x: 0,  w: 19 },
  { id: 'muoi', name: 'Muối', x: 20, w: 22 },
  { id: 'dom',  name: 'Đóm',  x: 43, w: 23 },
  { id: 'dua',  name: 'Dừa',  x: 67, w: 30 },
];
const CRE_H = 24;
const T = 16, MW = 40, MH = 30;
const SEASONS = ['Xuân', 'Hạ', 'Thu', 'Đông'];
const DAYS_PER_SEASON = 3;                 // shortened for testing
const SPEED = 56;                          // px / s
const MIN_PER_SEC = 5;                     // game minutes per real second

const farmerImg = new Image(); farmerImg.src = 'farmer.png';
const creImg = new Image(); creImg.src = 'creatures.png';

// ===== map =====
// tile kinds: 0 grass, 1 path, 2 field (diggable), 3 water, 4 house(block), 5 fence
const map = new Uint8Array(MW * MH);
const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? 4 : map[y * MW + x];
const set = (x, y, k) => map[y * MW + x] = k;
const HOUSE = { tx: 3, ty: 2, tw: 6, th: 5 }, DOOR = { tx: 5, ty: 6 };
const FIELD = { tx: 3, ty: 10, tw: 12, th: 9 };
for (let y = HOUSE.ty; y < HOUSE.ty + HOUSE.th; y++) for (let x = HOUSE.tx; x < HOUSE.tx + HOUSE.tw; x++) set(x, y, 4);
for (let y = DOOR.ty + 1; y < 26; y++) set(DOOR.tx, y, 1);
for (let x = 0; x < MW; x++) set(x, 25, 1);
for (let y = FIELD.ty; y < FIELD.ty + FIELD.th; y++) for (let x = FIELD.tx; x < FIELD.tx + FIELD.tw; x++) if (at(x, y) === 0) set(x, y, 2);
for (let x = FIELD.tx - 1; x <= FIELD.tx + FIELD.tw; x++) { if (at(x, FIELD.ty - 1) === 0) set(x, FIELD.ty - 1, 5); if (at(x, FIELD.ty + FIELD.th) === 0) set(x, FIELD.ty + FIELD.th, 5); }
for (let y = FIELD.ty - 1; y <= FIELD.ty + FIELD.th; y++) { if (at(FIELD.tx - 1, y) === 0) set(FIELD.tx - 1, y, 5); if (at(FIELD.tx + FIELD.tw, y) === 0) set(FIELD.tx + FIELD.tw, y, 5); }
for (let y = 3; y < 10; y++) for (let x = 24; x < 33; x++) { const dx = (x - 28) / 4.6, dy = (y - 6) / 3.6; if (dx * dx + dy * dy < 1) set(x, y, 3); }
const isBlock = k => k === 3 || k === 4 || k === 5;

// farm tile state: {tilled, wet, crop: null | {stage, watered}}
const farm = new Map();
const key = (x, y) => x + ',' + y;

// ===== pixel helpers =====
function rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const PAL = {
  Xuân: { g: '#7cb252', g2: '#6ea447', g3: '#5c9140', fl: ['#fff4d6', '#f7a8c4', '#f4c542'] },
  Hạ:   { g: '#5fae4a', g2: '#53a041', g3: '#468a37', fl: ['#f4c542', '#e8797a', '#fff4d6'] },
  Thu:  { g: '#b39a4c', g2: '#a48a40', g3: '#8d7535', fl: ['#d9692e', '#c4492f', '#f4c542'] },
  Đông: { g: '#e6eef2', g2: '#d3dfe6', g3: '#bccbd4', fl: ['#ffffff', '#a8c8d8', '#ffffff'] },
};
const ground = document.createElement('canvas'); ground.width = MW * T; ground.height = MH * T;
function paintGround(season) {
  const g = ground.getContext('2d'), R = rng(5), p = PAL[season];
  const px = (x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
    const k = at(tx, ty), X = tx * T, Y = ty * T;
    px(X, Y, R() < .3 ? p.g2 : p.g, T, T);
    for (let i = 0; i < 2; i++) { const x = X + 2 + R() * 11 | 0, y = Y + 3 + R() * 10 | 0; px(x, y, p.g3); px(x + 2, y, p.g3); px(x + 1, y - 1, p.g3); }
    if (k === 0 && R() < .06) { const x = X + 6, y = Y + 6, c = p.fl[(R() * 3) | 0]; px(x, y, c); px(x - 1, y + 1, c); px(x + 1, y + 1, c); px(x, y + 2, c); }
    if (k === 1) { px(X, Y, season === 'Đông' ? '#cfc2a8' : '#caa46e', T, T); for (let i = 0; i < 4; i++) px(X + R() * 15 | 0, Y + R() * 15 | 0, '#b08a58'); }
    if (k === 2) { px(X, Y, season === 'Đông' ? '#c9c2b6' : '#9a7a4e', T, T); px(X, Y, season === 'Đông' ? '#bdb5a8' : '#8b6c43', T, 1); for (let i = 0; i < 3; i++) px(X + R() * 15 | 0, Y + R() * 15 | 0, '#7a5c37'); }
    if (k === 3) { px(X, Y, season === 'Đông' ? '#a9d4e6' : '#3f8fb0', T, T); if (R() < .5) px(X + 3 + R() * 8 | 0, Y + 5 + R() * 6 | 0, '#9fd3e3', 4, 1); }
    if (k === 5) { px(X + 2, Y + 3, '#2b1d12', 3, 12); px(X + 3, Y + 4, '#a8743d', 1, 10); px(X + 11, Y + 3, '#2b1d12', 3, 12); px(X + 12, Y + 4, '#a8743d', 1, 10); px(X, Y + 6, '#2b1d12', T, 3); px(X, Y + 7, '#c48a4a', T, 1); }
  }
  // pond rim
  for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) if (at(tx, ty) === 3) {
    const X = tx * T, Y = ty * T;
    if (at(tx, ty - 1) !== 3) px(X, Y, '#2b5e78', T, 2);
    if (at(tx - 1, ty) !== 3) px(X, Y, '#2b5e78', 2, T);
    if (at(tx + 1, ty) !== 3) px(X + T - 2, Y, '#2b5e78', 2, T);
  }
  // house
  const HX = HOUSE.tx * T, HY = HOUSE.ty * T, HW = HOUSE.tw * T, HH = HOUSE.th * T;
  px(HX + 4, HY + 30, '#2b1d12', HW - 8, HH - 30); px(HX + 5, HY + 31, '#e8d3a8', HW - 10, HH - 32);
  for (let y = HY + 35; y < HY + HH - 2; y += 5) px(HX + 5, y, '#d4bb8c', HW - 10, 1);
  for (let i = 0; i < 30; i++) { px(HX + i, HY + 32 - i, '#2b1d12', HW - i * 2, 1); if (i) px(HX + 1 + i, HY + 32 - i, (i % 4 < 2) ? (season === 'Đông' ? '#f4f8fa' : '#c4583a') : (season === 'Đông' ? '#dfe8ee' : '#a9452d'), HW - 2 - i * 2, 1); }
  const DX = DOOR.tx * T + 2, DY = DOOR.ty * T - 6;
  px(DX, DY, '#2b1d12', 12, 22); px(DX + 1, DY + 1, '#8a5a2b', 10, 21); px(DX + 8, DY + 11, '#f4c542', 2, 2);
  px(HX + 12, HY + 40, '#2b1d12', 14, 12); px(HX + 13, HY + 41, '#9fd3e3', 12, 10); px(HX + 19, HY + 41, '#2b1d12', 1, 10);
  px(HX + HW - 26, HY + 40, '#2b1d12', 14, 12); px(HX + HW - 25, HY + 41, '#9fd3e3', 12, 10); px(HX + HW - 19, HY + 41, '#2b1d12', 1, 10);
}

function drawFarmTile(g, x, y, f) {
  const X = x * T, Y = y * T;
  const px = (a, b, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(X + a, Y + b, w, h); };
  if (f.tilled) {
    px(0, 0, f.wet ? '#4f331d' : '#6e4a2b', T, T);
    for (let r = 2; r < 16; r += 4) px(1, r, f.wet ? '#3e2716' : '#5b3c22', 14, 1);
    px(0, 0, '#2b1d12', T, 1); px(0, 0, '#2b1d12', 1, T);
  }
  const c = f.crop; if (!c) return;
  if (c.stage === 0) { px(6, 8, '#d9c7a3'); px(9, 9, '#d9c7a3'); px(7, 11, '#d9c7a3'); }
  else if (c.stage === 1) { px(7, 7, '#3f7a2c', 2, 5); px(5, 6, '#6fb94a', 3, 2); px(9, 5, '#6fb94a', 3, 2); }
  else if (c.stage === 2) { px(7, 5, '#3f7a2c', 2, 7); px(3, 4, '#6fb94a', 4, 3); px(9, 3, '#6fb94a', 4, 3); px(5, 8, '#5aa03e', 3, 2); px(9, 8, '#5aa03e', 3, 2); }
  else { px(4, 9, '#2b1d12', 8, 6); px(5, 10, '#f3eef5', 6, 4); px(5, 10, '#c77bc0', 6, 2); px(7, 2, '#3f7a2c', 2, 8); px(2, 2, '#6fb94a', 5, 3); px(9, 1, '#6fb94a', 5, 3); }
}

// ===== state =====
const P = { x: (DOOR.tx + .5) * T, y: (DOOR.ty + 2) * T, dir: 'down', flip: false, moving: false, t: 0, act: null, trail: [] };
const S = { day: 1, seasonIdx: 0, minutes: 6 * 60, turnips: 0, seeds: 20, tool: 0, out: null, sleeping: false };
const party = [];
const R = rng(42);
const wild = CRE.map((c, i) => {
  const x = [31, 22, 35, 27][i] * T, y = [14, 19, 22, 27][i] * T;
  return { ...c, sx: c.x, x, y, tx: x, ty: y, wait: R() * 2, flip: false, moving: false, t: R() * 9, caught: false, flee: 0, shake: 0 };
});
let mini = null;   // lasso minigame

const TOOLS = [
  { id: 'hoe', name: 'Cuốc' }, { id: 'water', name: 'Bình tưới' }, { id: 'seed', name: 'Hạt củ cải' }, { id: 'lasso', name: 'Dây thừng' },
];

// ===== UI =====
const $ = id => document.getElementById(id);
const toastEl = $('toast'); let toastT = 5;
function toast(m, s = 2.6) { toastEl.textContent = m; toastEl.hidden = false; toastT = s; }
function iconCanvas(draw) { const c = document.createElement('canvas'); c.width = c.height = 16; draw(c.getContext('2d')); return c; }
const ICONS = {
  hoe: g => { g.fillStyle = '#2b1d12'; g.fillRect(3, 2, 2, 12); g.fillStyle = '#a8743d'; g.fillRect(4, 3, 1, 10); g.fillStyle = '#2b1d12'; g.fillRect(4, 2, 9, 4); g.fillStyle = '#b8c4cc'; g.fillRect(5, 3, 7, 2); },
  water: g => { g.fillStyle = '#2b1d12'; g.fillRect(3, 6, 8, 8); g.fillRect(10, 5, 4, 2); g.fillStyle = '#7d9fb5'; g.fillRect(4, 7, 6, 6); g.fillRect(11, 6, 2, 1); g.fillStyle = '#2b1d12'; g.fillRect(5, 3, 4, 3); g.fillStyle = '#7fd0e8'; g.fillRect(14, 8, 1, 1); g.fillRect(13, 10, 1, 1); },
  seed: g => { g.fillStyle = '#2b1d12'; g.fillRect(3, 3, 10, 11); g.fillStyle = '#e8d3a8'; g.fillRect(4, 4, 8, 9); g.fillStyle = '#c77bc0'; g.fillRect(6, 7, 4, 3); g.fillStyle = '#6fb94a'; g.fillRect(7, 5, 2, 2); },
  lasso: g => { g.fillStyle = '#2b1d12'; g.fillRect(3, 3, 10, 10); g.fillStyle = '#c99a5b'; g.fillRect(4, 4, 8, 8); g.fillStyle = '#2b1d12'; g.fillRect(6, 6, 4, 4); g.fillStyle = '#c99a5b'; g.fillRect(12, 11, 3, 2); },
};
const hotbar = $('hotbar');
TOOLS.forEach((t, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'slot'; b.id = 'slot' + i; b.title = t.name;
  b.innerHTML = `<span class="n">${i + 1}</span>`; b.appendChild(iconCanvas(ICONS[t.id]));
  if (t.id === 'seed') { const c = document.createElement('span'); c.className = 'c'; c.id = 'seedCount'; b.appendChild(c); }
  b.onclick = () => selectTool(i); hotbar.appendChild(b);
});
function selectTool(i) { S.tool = i; [...hotbar.children].forEach((b, j) => b.classList.toggle('on', j === i)); toast(TOOLS[i].name, 1.2); }
selectTool(0); toast('Chọn Cuốc (1), đứng cạnh ô đất trong vườn rồi bấm Space', 5);
function refreshHud() {
  $('dateBox').textContent = `${SEASONS[S.seasonIdx]} · Ngày ${S.day}`;
  const h = Math.floor(S.minutes / 60) % 24, m = Math.floor(S.minutes % 60);
  $('clockBox').textContent = `${h}:${String(m).padStart(2, '0')}`;
  $('bagBox').textContent = `Củ cải: ${S.turnips}`;
  $('seedCount').textContent = S.seeds;
}
function refreshParty() {
  const el = $('party'); el.querySelectorAll('.slot').forEach(n => n.remove());
  party.forEach((w, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'slot' + (S.out === w ? ' out' : ''); b.title = w.name;
    const c = document.createElement('canvas'); c.width = w.w; c.height = CRE_H; c.style.width = '32px'; c.style.height = (32 * CRE_H / w.w) + 'px';
    c.getContext('2d').drawImage(creImg, w.sx, 0, w.w, CRE_H, 0, 0, w.w, CRE_H); b.appendChild(c);
    b.onclick = () => summon(w); el.appendChild(b);
  });
}

// ===== input =====
const keys = new Set(); let joy = null;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  if (e.repeat) return;
  if (k === ' ' || k === 'j') use();
  else if (k === 'e') interact();
  else if (k === 'q') summon();
  else if ('1234'.includes(k)) selectTool(+k - 1);
  else keys.add(k);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
const cv = $('c'), ctx = cv.getContext('2d');
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); joy = { id: e.pointerId, ox: e.offsetX, oy: e.offsetY, dx: 0, dy: 0, t: performance.now() }; });
cv.addEventListener('pointermove', e => { if (joy && e.pointerId === joy.id) { joy.dx = e.offsetX - joy.ox; joy.dy = e.offsetY - joy.oy; } });
const endJoy = e => { if (joy && e.pointerId === joy.id) { if (Math.hypot(joy.dx, joy.dy) < 8 && performance.now() - joy.t < 250) use(); joy = null; } };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
$('tUse').onclick = use; $('tE').onclick = interact; $('tQ').onclick = () => summon();

function inputVec() {
  let x = 0, y = 0;
  if (keys.has('a') || keys.has('arrowleft')) x--;
  if (keys.has('d') || keys.has('arrowright')) x++;
  if (keys.has('w') || keys.has('arrowup')) y--;
  if (keys.has('s') || keys.has('arrowdown')) y++;
  if (joy) { const l = Math.hypot(joy.dx, joy.dy); if (l > 12) { x = joy.dx / l; y = joy.dy / l; } }
  const l = Math.hypot(x, y); return l ? [x / l, y / l] : [0, 0];
}
const SECT = { 0: ['side', false], 1: ['downside', false], 2: ['down', false], 3: ['downside', true], 4: ['side', true], '-4': ['side', true], '-1': ['upside', false], '-2': ['up', false], '-3': ['upside', true] };
// tool rows exist for down / side / up; diagonals use side
function toolDir() { return P.dir === 'downside' || P.dir === 'upside' ? 'side' : P.dir; }
function targetTile() {
  const d = toolDir(), tx = Math.floor(P.x / T), ty = Math.floor((P.y - 2) / T);
  if (d === 'down') return [tx, ty + 1]; if (d === 'up') return [tx, ty - 1];
  return [tx + (P.flip ? -1 : 1), ty];
}

// ===== actions =====
function startAct(kind, onHit) { P.act = { kind, t: 0, onHit, hit: false }; P.dir = toolDir(); }
function use() {
  if (S.sleeping) return;
  if (mini) { pull(); return; }
  if (P.act) return;
  const [tx, ty] = targetTile(), k = at(tx, ty), f = farm.get(key(tx, ty));
  if (f && f.crop && f.crop.stage >= 3) {                                         // harvest with any tool
    f.crop = null; S.turnips++; refreshHud(); toast('Thu hoạch 1 củ cải!'); popItem(tx, ty); return;
  }
  const tool = TOOLS[S.tool].id;
  if (tool === 'hoe') {
    if (k !== 2) { toast('Chỉ cuốc được đất trong vườn'); return; }
    startAct('hoe', () => { const g = farm.get(key(tx, ty)) || { tilled: false, wet: false, crop: null }; g.tilled = true; farm.set(key(tx, ty), g); });
  } else if (tool === 'water') {
    startAct('water', () => { if (f && f.tilled) { f.wet = true; if (f.crop) f.crop.watered = true; } });
  } else if (tool === 'seed') {
    if (S.seasonIdx === 3) { toast('Mùa đông đất lạnh, không gieo được'); return; }
    if (!f || !f.tilled) { toast('Cuốc đất trước rồi mới gieo'); return; }
    if (f.crop) { toast('Ô này đã gieo rồi'); return; }
    if (!S.seeds) { toast('Hết hạt giống'); return; }
    f.crop = { stage: 0, watered: f.wet }; S.seeds--; refreshHud(); toast('Đã gieo hạt củ cải. Nhớ tưới!', 1.6);
  } else if (tool === 'lasso') {
    startAct('lasso', () => {
      const tgt = lassoTarget();
      if (!tgt) { toast('Quăng hụt. Đứng gần linh thú hơn (1-2 ô) và quay mặt về phía nó'); return; }
      startMini(tgt);
    });
  }
}
function lassoTarget() {
  const d = toolDir(), fx = d === 'side' ? (P.flip ? -1 : 1) : 0, fy = d === 'down' ? 1 : d === 'up' ? -1 : 0;
  let best = null, bd = 44;
  for (const w of wild) {
    if (w.caught || w.flee > 0) continue;
    const dx = w.x - P.x, dy = w.y - P.y, dist = Math.hypot(dx, dy);
    if (dist < bd && (dx * fx + dy * fy) > dist * 0.3) { bd = dist; best = w; }
  }
  return best;
}
// timing minigame: press when the marker is inside the green zone, 3 hits before 3 misses
function startMini(w) {
  mini = { w, pos: 0, dir: 1, speed: 1.1 + R() * .4, zone: .35 + R() * .3, size: .2, hits: 0, miss: 0, flash: 0 };
  w.moving = false; toast(`Đã quăng dây trúng ${w.name}! Bấm Space khi kim vào ô xanh`, 3);
}
function pull() {
  const m = mini, ok = Math.abs(m.pos - m.zone) < m.size / 2;
  m.flash = .25; m.w.shake = .3;
  if (ok) {
    m.hits++;
    if (m.hits >= 3) {
      m.w.caught = true; party.push(m.w); mini = null; refreshParty();
      toast(`Đã buộc dây được ${m.w.name}! Bấm Q hoặc chạm vào ô linh thú để gọi ra`, 3.5); return;
    }
    m.zone = .2 + R() * .6; m.size = Math.max(.12, m.size - .03); m.speed += .35;
  } else {
    m.miss++;
    if (m.miss >= 3) { m.w.flee = 6; mini = null; toast(`${m.w.name} giật đứt dây chạy mất! Thử lại sau`, 2.6); return; }
  }
}
function summon(which) {
  if (!party.length) { toast('Chưa có linh thú nào. Dùng Dây thừng (4) để bắt'); return; }
  const next = which || (S.out ? party[(party.indexOf(S.out) + 1) % (party.length + 1)] : party[0]);
  if (S.out) { poofs.push({ x: S.out.x, y: S.out.y - 8, t: 0 }); }
  if (!next || next === S.out) { if (S.out) toast(`Đã thu ${S.out.name} về dây`); S.out = null; refreshParty(); return; }
  S.out = next; next.x = P.x + (P.flip ? 14 : -14); next.y = P.y + 4; P.trail = [];
  poofs.push({ x: next.x, y: next.y - 8, t: 0 }); toast(`Ra đây nào, ${next.name}!`, 1.6); refreshParty();
}
function interact() {
  if (S.sleeping || mini) return;
  const tx = Math.floor(P.x / T), ty = Math.floor((P.y - 2) / T);
  if (Math.abs(tx - DOOR.tx) <= 1 && ty >= DOOR.ty && ty <= DOOR.ty + 2) sleep(false);
  else toast('Đến cửa nhà rồi bấm E để đi ngủ');
}
function sleep(passedOut) {
  S.sleeping = true; const fade = $('fade');
  fade.textContent = passedOut ? 'Bạn ngất vì thức quá khuya...' : 'Ngủ ngon...'; fade.classList.add('show');
  setTimeout(() => {
    S.day++;
    if (S.day > DAYS_PER_SEASON) { S.day = 1; S.seasonIdx = (S.seasonIdx + 1) % 4; paintGround(SEASONS[S.seasonIdx]); }
    for (const f of farm.values()) {
      if (f.crop) {
        if (S.seasonIdx === 3) f.crop = null;                       // winter frost kills crops
        else if (f.crop.watered && f.crop.stage < 3) f.crop.stage++;
        if (f.crop) f.crop.watered = false;
      }
      f.wet = S.seasonIdx !== 3 && R() < .15;                       // occasional rain
      if (f.wet && f.crop) f.crop.watered = true;
    }
    S.minutes = 6 * 60; P.x = (DOOR.tx + .5) * T; P.y = (DOOR.ty + 2) * T; P.dir = 'down'; P.flip = false;
    if (S.out) { S.out.x = P.x - 14; S.out.y = P.y + 4; }
    refreshHud(); fade.textContent = `${SEASONS[S.seasonIdx]} · Ngày ${S.day}`;
    setTimeout(() => { fade.classList.remove('show'); S.sleeping = false; }, 900);
  }, 700);
}

const poofs = [], pops = [];
function popItem(tx, ty) { pops.push({ x: tx * T + 8, y: ty * T, t: 0 }); }

// ===== update =====
function blocked(x, y) { return isBlock(at(Math.floor(x / T), Math.floor(y / T))) || isBlock(at(Math.floor((x - 4) / T), Math.floor(y / T))) || isBlock(at(Math.floor((x + 4) / T), Math.floor(y / T))); }
function update(dt) {
  if (!S.sleeping) {
    S.minutes += MIN_PER_SEC * dt;
    if (S.minutes >= 26 * 60) sleep(true);
  }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.hidden = true; }
  if (mini) { const m = mini; m.pos += m.dir * m.speed * dt; if (m.pos > 1) { m.pos = 1; m.dir = -1; } if (m.pos < 0) { m.pos = 0; m.dir = 1; } m.flash = Math.max(0, m.flash - dt); }

  if (P.act) {
    P.act.t += dt; const n = ROWS[P.dir + '_' + P.act.kind].length, i = P.act.t * FPS[P.act.kind];
    if (!P.act.hit && i >= 1.5) { P.act.hit = true; P.act.onHit && P.act.onHit(); }
    if (i >= n + .5) P.act = null;
  } else if (!mini && !S.sleeping) {
    const [vx, vy] = inputVec(), mv = !!(vx || vy);
    if (mv !== P.moving) { P.moving = mv; P.t = 0; }
    if (mv) {
      [P.dir, P.flip] = SECT[Math.round(Math.atan2(vy, vx) / (Math.PI / 4))];
      const nx = P.x + vx * SPEED * dt, ny = P.y + vy * SPEED * dt;
      if (!blocked(nx, P.y) && nx > 6 && nx < MW * T - 6) P.x = nx;
      if (!blocked(P.x, ny) && ny > 12 && ny < MH * T - 2) P.y = ny;
      const l = P.trail[0]; if (!l || Math.hypot(l.x - P.x, l.y - P.y) > 2) { P.trail.unshift({ x: P.x, y: P.y }); P.trail.length = Math.min(P.trail.length, 40); }
    }
  } else P.moving = false;
  P.t += dt;

  for (const w of wild) {
    w.t += dt; w.shake = Math.max(0, w.shake - dt);
    if (w.caught && S.out !== w) continue;
    let gx, gy, sp;
    if (S.out === w) { const p = P.trail[Math.min(P.trail.length - 1, 9)] || P; gx = p.x; gy = p.y; sp = SPEED * 1.2; }
    else if (mini && mini.w === w) continue;
    else {
      if (w.flee > 0) { w.flee -= dt; const dx = w.x - P.x, dy = w.y - P.y, d = Math.hypot(dx, dy) || 1; if (d < 90) { w.tx = w.x + dx / d * 30; w.ty = w.y + dy / d * 30; w.wait = .3; } }
      w.wait -= dt;
      if (w.wait <= 0 && Math.hypot(w.tx - w.x, w.ty - w.y) < 1.5) {
        w.wait = 1 + R() * 3;
        for (let k = 0; k < 8; k++) { const ax = w.x + (R() - .5) * 70, ay = w.y + (R() - .5) * 60; if (ax > 18 * T && ax < (MW - 1) * T && ay > 11 * T && ay < (MH - 1) * T && !blocked(ax, ay)) { w.tx = ax; w.ty = ay; break; } }
      }
      gx = w.tx; gy = w.ty; sp = w.flee > 0 ? 50 : 18;
    }
    const dx = gx - w.x, dy = gy - w.y, d = Math.hypot(dx, dy);
    w.moving = d > (S.out === w ? 4 : 1);
    if (w.moving) { const st = Math.min(d, sp * dt); const nx = w.x + dx / d * st, ny = w.y + dy / d * st; if (!blocked(nx, ny) || S.out === w) { w.x = nx; w.y = ny; } else { w.tx = w.x; w.ty = w.y; } if (Math.abs(dx) > .5) w.flip = dx < 0; }
  }
  for (const p of poofs) p.t += dt; while (poofs.length && poofs[0].t > .5) poofs.shift();
  for (const p of pops) p.t += dt; while (pops.length && pops[0].t > .8) pops.shift();
}

// ===== render =====
let dpr = 1, Z = 4;
const stage = $('stage');
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); const r = stage.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  Z = r.width < 600 ? 3 : 4;
}
new ResizeObserver(resize).observe(stage); resize();

function shadow(x, y, w) { ctx.fillStyle = 'rgba(43,29,18,.3)'; ctx.fillRect(Math.round(x - w / 2), Math.round(y - 1), w, 2); ctx.fillRect(Math.round(x - w / 2 + 1), Math.round(y - 2), w - 2, 4); }
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  const z = Z * dpr, vw = cv.width / z, vh = cv.height / z;
  let cx = Math.round(Math.max(0, Math.min(MW * T - vw, P.x - vw / 2))), cy = Math.round(Math.max(0, Math.min(MH * T - vh, P.y - 12 - vh / 2)));
  if (MW * T < vw) cx = Math.round((MW * T - vw) / 2); if (MH * T < vh) cy = Math.round((MH * T - vh) / 2);
  ctx.fillStyle = '#2b1d12'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(z, 0, 0, z, -cx * z, -cy * z); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(ground, 0, 0);
  for (const [k, f] of farm) { const [x, y] = k.split(',').map(Number); drawFarmTile(ctx, x, y, f); }

  // target cursor
  if (!P.act && !mini && !S.sleeping) {
    const [tx, ty] = targetTile(); ctx.strokeStyle = 'rgba(255,244,214,.85)'; ctx.lineWidth = 1;
    ctx.strokeRect(tx * T + .5, ty * T + .5, T - 1, T - 1);
  }

  const ents = [];
  ents.push({ y: P.y, d: () => {
    let k, i;
    if (P.act) { k = P.dir + '_' + P.act.kind; i = Math.min(ROWS[k].length - 1, Math.floor(P.act.t * FPS[P.act.kind])); }
    else { k = P.dir + '_' + (P.moving ? 'walk' : 'idle'); i = Math.floor(P.t * FPS[P.moving ? 'walk' : 'idle']) % ROWS[k].length; }
    if (mini) { k = P.dir + '_lasso'; i = 2; }
    shadow(P.x, P.y, 12);
    if (farmerImg.complete && farmerImg.naturalWidth) {
      const [sx, sy] = ROWS[k][i]; ctx.save(); ctx.translate(Math.round(P.x), Math.round(P.y)); if (P.flip) ctx.scale(-1, 1);
      ctx.drawImage(farmerImg, sx, sy, CW, CH, -CW / 2, -FOOT, CW, CH); ctx.restore();
    }
  } });
  for (const w of wild) {
    if (w.caught && S.out !== w) continue;
    ents.push({ y: w.y, d: () => {
      const hop = w.moving ? Math.round(Math.abs(Math.sin(w.t * 12)) * 3) : (Math.sin(w.t * 3) > .7 ? 1 : 0);
      const sh = w.shake > 0 ? Math.round(Math.sin(w.t * 60) * 1.5) : 0;
      const x = Math.round(w.x) + sh, y = Math.round(w.y);
      shadow(x, y, Math.round(w.w * .6));
      if (creImg.complete && creImg.naturalWidth) { ctx.save(); ctx.translate(x, y - hop); if (w.flip) ctx.scale(-1, 1); ctx.drawImage(creImg, w.sx, 0, w.w, CRE_H, -Math.round(w.w / 2), -CRE_H, w.w, CRE_H); ctx.restore(); }
      if (w.flee > 0) { ctx.fillStyle = '#fff4d6'; ctx.fillRect(x + 6, y - CRE_H - 8, 1, 4); ctx.fillRect(x + 6, y - CRE_H - 3, 1, 1); }
    } });
  }
  ents.sort((a, b) => a.y - b.y).forEach(e => e.d());

  // rope during the minigame
  if (mini) {
    ctx.strokeStyle = '#c99a5b'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(Math.round(P.x + (P.flip ? -6 : 6)) + .5, Math.round(P.y - 16) + .5);
    ctx.quadraticCurveTo((P.x + mini.w.x) / 2, Math.max(P.y, mini.w.y) - 4, Math.round(mini.w.x) + .5, Math.round(mini.w.y - 10) + .5); ctx.stroke();
  }
  for (const p of poofs) { const r = 3 + p.t * 22; ctx.fillStyle = `rgba(255,244,214,${1 - p.t * 2})`; for (let a = 0; a < 6; a++) ctx.fillRect(Math.round(p.x + Math.cos(a) * r), Math.round(p.y + Math.sin(a) * r * .6), 3, 3); }
  for (const p of pops) { const y = Math.round(p.y - p.t * 14); ctx.fillStyle = '#2b1d12'; ctx.fillRect(p.x - 3, y, 7, 6); ctx.fillStyle = '#f3eef5'; ctx.fillRect(p.x - 2, y + 1, 5, 4); ctx.fillStyle = '#c77bc0'; ctx.fillRect(p.x - 2, y + 1, 5, 2); ctx.fillStyle = '#6fb94a'; ctx.fillRect(p.x - 1, y - 3, 3, 3); }

  // night tint
  const h = S.minutes / 60;
  const dark = h < 18 ? 0 : Math.min(.55, (h - 18) / 6 * .55);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (dark > 0) { ctx.fillStyle = `rgba(20,16,50,${dark})`; ctx.fillRect(0, 0, cv.width, cv.height); }

  // minigame bar (screen space)
  if (mini) {
    const W = Math.min(cv.width * .6, 360 * dpr), H = 18 * dpr, X = (cv.width - W) / 2, Y = cv.height * .26;
    ctx.fillStyle = '#2b1d12'; ctx.fillRect(X - 4 * dpr, Y - 4 * dpr, W + 8 * dpr, H + 8 * dpr);
    ctx.fillStyle = '#7a5c37'; ctx.fillRect(X, Y, W, H);
    ctx.fillStyle = mini.flash > 0 ? '#c8f08f' : '#6fb94a'; ctx.fillRect(X + (mini.zone - mini.size / 2) * W, Y, mini.size * W, H);
    ctx.fillStyle = '#fff4d6'; ctx.fillRect(X + mini.pos * W - 2 * dpr, Y - 6 * dpr, 4 * dpr, H + 12 * dpr);
    ctx.font = `${14 * dpr}px "Pixelify Sans", monospace`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff4d6';
    ctx.fillText(`Kéo dây ${mini.w.name}: ${'●'.repeat(mini.hits)}${'○'.repeat(3 - mini.hits)}   hụt ${mini.miss}/3`, cv.width / 2, Y - 12 * dpr);
  }
}

paintGround('Xuân'); refreshHud();
creImg.onload = refreshParty;
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
  update(dt); render(); hudT += dt; if (hudT > .25) { hudT = 0; refreshHud(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
